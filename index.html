<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Quest</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
<section id="start" class="screen">
<div class="hero"><b>ENGLISH QUEST</b><h1>英単語アタック！</h1><p>単語力をゲーム感覚でチェック</p></div>
<div class="card settings">
<label>出題範囲<div class="range"><input id="from" type="number" min="1" value="1"><span>〜</span><input id="to" type="number" min="1" value="1400"></div><small id="info">単語データを読み込んでいます…</small></label>
<label>問題数<select id="count"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option></select></label>
<label>モード<select id="mode"><option value="en-ja">英語 → 日本語</option><option value="ja-en">日本語 → 英語</option><option value="mixed" selected>ミックス</option></select></label>
<button id="startBtn" type="button" disabled>読み込み中…</button>
<p id="err" role="alert"></p>
</div>
<p class="tip">💡 2人1組なら1台のスマホを交代で操作できます。</p>
</section>

<section id="game" class="screen hidden">
<header><div><span id="qnum">Q 1 / 20</span><div class="bar"><i id="bar"></i></div></div><strong>Score <em id="score">0</em></strong></header>
<div id="combo">🔥 COMBO ×0</div>
<div class="card question"><small id="type">英語 → 日本語</small><h2 id="question"></h2><p id="example" class="hidden"></p></div>
<div id="choices" class="choices"></div><div id="feedback"></div>
<button id="next" class="hidden" type="button">次の問題へ</button>
</section>

<section id="result" class="screen hidden">
<div class="hero"><b>RESULT</b><h1>ゲーム終了！</h1></div>
<div class="card result"><div class="final"><small>FINAL SCORE</small><strong id="finalScore">0</strong></div>
<div class="stats"><div>正解<strong id="correct">0</strong></div><div>問題数<strong id="total">0</strong></div><div>正答率<strong id="accuracy">0%</strong></div><div>MAX COMBO<strong id="maxCombo">0</strong></div></div>
<p id="message"></p><button id="again" type="button">もう一度遊ぶ</button></div>
</section>
</main>
<script src="./game.js?v=2" defer></script>
</body>
</html>
