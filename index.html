red a large part of Europe.","example_jp":"ローマ人はヨーロッパの大部分を征服した。"},{"id":1317,"word":"persist","meaning":"固執する、しつこく続ける","example":"If the symptoms persist, consult a doctor.","example_jp":"症状がしつこく続く場合は医者に相談してください。"},{"id":1318,"word":"last","meaning":"続く","example":"The meeting will last for two hours.","example_jp":"会議は2時間続く。"},{"id":1319,"word":"surrender","meaning":"を引き渡す","example":"The enemy troops finally surrendered.","example_jp":"敵軍はついに（武器）を引き渡した（降伏した）。"},{"id":1320,"word":"betray","meaning":"を裏切る、を漏らす","example":"He betrayed his best friend by telling his secret.","example_jp":"彼は親友の秘密を漏らして裏切った。"},{"id":1321,"word":"strain","meaning":"をぴんと張る、を痛める","example":"Don't strain your eyes by reading in the dark.","example_jp":"暗い所で本を読んで目を痛めないように。"},{"id":1322,"word":"refrain","meaning":"控える","example":"Please refrain from smoking here.","example_jp":"ここでの喫煙は控えてください。"},{"id":1323,"word":"scatter","meaning":"をまき散らす","example":"The wind scattered the leaves all over the yard.","example_jp":"風が庭中に落ち葉をまき散らした。"},{"id":1324,"word":"spill","meaning":"をこぼす","example":"I accidentally spilled coffee on the keyboard.","example_jp":"うっかりキーボードにコーヒーをこぼしてしまった。"},{"id":1325,"word":"prevail","meaning":"普及する、勝る","example":"Common sense should prevail.","example_jp":"常識が普及する（勝る）べきだ。"},{"id":1326,"word":"starve","meaning":"飢えに苦しむ、渇望する","example":"Without food, the animals will starve.","example_jp":"食料がなければ動物たちは飢えに苦しむだろう。"},{"id":1327,"word":"digest","meaning":"を消化する","example":"Some foods are hard to digest.","example_jp":"一部の食べ物は消化するのが難しい。"},{"id":1328,"word":"disguise","meaning":"を変装させる","example":"He disguised himself as a police officer.","example_jp":"彼は警察官に変装させた（変装した）。"},{"id":1329,"word":"strip","meaning":"から剥奪する、取り去る","example":"The soldiers stripped him of his rank.","example_jp":"兵士たちは彼から階級を剥奪した。"},{"id":1330,"word":"scratch","meaning":"をかく","example":"Be careful not to scratch the car.","example_jp":"車をかかない（傷つけない）ように注意してください。"},{"id":1331,"word":"bathe","meaning":"を入浴させる","example":"She bathed the baby in warm water.","example_jp":"彼女は赤ちゃんを温かいお湯で入浴させた。"},{"id":1332,"word":"soak","meaning":"を浸す","example":"Soak the beans in water overnight.","example_jp":"一晩豆を水に浸してください。"},{"id":1333,"word":"stir","meaning":"をかき回す、呼び起こす","example":"Stir the soup constantly so it doesn't burn.","example_jp":"焦げないようにスープを絶えずかき回してください。"},{"id":1334,"word":"wind","meaning":"曲がりくねる","example":"The river winds through the valley.","example_jp":"その川は谷を曲がりくねっている。"},{"id":1335,"word":"heal","meaning":"を治す、癒す","example":"It takes time for a broken bone to heal.","example_jp":"折れた骨が治るのには時間がかかる。"},{"id":1336,"word":"knit","meaning":"を編む","example":"My grandmother knitted a sweater for me.","example_jp":"祖母は私のためにセーターを編んでくれた。"},{"id":1337,"word":"sew","meaning":"を縫いつける","example":"She sewed a button onto her coat.","example_jp":"彼女はコートにボタンを縫いつけた。"},{"id":1338,"word":"dye","meaning":"を染める","example":"She dyed her hair brown.","example_jp":"彼女は髪を茶色に染めた。"},{"id":1339,"word":"beg","meaning":"を懇願する、請う","example":"The homeless man begged for money.","example_jp":"そのホームレスの男性はお金を懇願した。"},{"id":1340,"word":"pray","meaning":"祈る","example":"They pray at the temple every morning.","example_jp":"彼らは毎朝お寺で祈る。"},{"id":1341,"word":"congratulate","meaning":"に祝いの言葉を述べる","example":"I'd like to congratulate you on your graduation.","example_jp":"あなたの卒業に祝いの言葉を述べたい。"},{"id":1342,"word":"summit","meaning":"頂上","example":"They reached the summit of the mountain at noon.","example_jp":"彼らは正午に山の頂上に着いた。"},{"id":1343,"word":"mayor","meaning":"市長","example":"The mayor gave a speech at the opening ceremony.","example_jp":"市長は開会式で演説をした。"},{"id":1344,"word":"secretary","meaning":"秘書","example":"The secretary arranged a meeting for the boss.","example_jp":"秘書はボスのために会議の手配をした。"},{"id":1345,"word":"council","meaning":"議会","example":"The city council approved the new budget.","example_jp":"市議会は新しい予算を承認した。"},{"id":1346,"word":"panel","meaning":"委員会","example":"A panel of experts discussed the issue.","examp example_jp":"忍耐は美徳である。"},{"id":1363,"word":"legend","meaning":"伝説","example":"The legend of King Arthur is famous.","example_jp":"アーサー王の伝説は有名だ。"},{"id":1364,"word":"prestige","meaning":"威信、名声","example":"The university has high international prestige.","example_jp":"その大学は高い国際的威信（名声）を持っている。"},{"id":1365,"word":"glory","meaning":"栄光","example":"The athlete ran for the glory of his country.","example_jp":"そのアスリートは祖国の栄光のために走った。"},{"id":1366,"word":"dignity","meaning":"尊厳","example":"We must respect human dignity.","example_jp":"私たちは人間の尊厳を尊重しなければならない。"},{"id":1367,"word":"worship","meaning":"崇拝","example":"People gathered at the temple for worship.","example_jp":"人々は崇拝のために神殿に集まった。"},{"id":1368,"word":"criterion","meaning":"基準","example":"What is your main criterion for choosing a job?","example_jp":"仕事を選ぶ主な基準は何ですか。"},{"id":1369,"word":"consent","meaning":"承諾、同意","example":"You need your parents' consent to go on the trip.","example_jp":"旅行に行くには両親の承諾が必要だ。"},{"id":1370,"word":"triumph","meaning":"勝利","example":"The team celebrated their great triumph.","example_jp":"チームは彼らの大きな勝利を祝った。"},{"id":1371,"word":"circulation","meaning":"血行、発行部数","example":"Exercise improves blood circulation.","example_jp":"運動は血行を良くする。"},{"id":1372,"word":"merit","meaning":"優秀さ、長所","example":"We should judge each case on its own merit.","example_jp":"私たちはそれぞれのケースをその長所（優秀さ）で判断すべきだ。"},{"id":1373,"word":"appetite","meaning":"食欲、欲求","example":"The long walk gave me a good appetite.","example_jp":"長く歩いたので良い食欲が出た。"},{"id":1374,"word":"nutrition","meaning":"栄養摂取","example":"Good nutrition is essential for growing children.","example_jp":"成長期の子供には良い栄養摂取が不可欠だ。"},{"id":1375,"word":"decay","meaning":"虫歯、衰退、荒廃","example":"Sugar causes tooth decay.","example_jp":"砂糖は虫歯（衰退）の原因になる。"},{"id":1376,"word":"atom","meaning":"原子","example":"Water consists of hydrogen and oxygen atoms.","example_jp":"水は水素と酸素の原子で構成されている。"},{"id":1377,"word":"boom","meaning":"好況、ブーム","example":"The city experienced an economic boom.","exam (()=>{const $=id=>document.getElementById(id);let data=[],questions=[],current=0,score=0,correct=0,combo=0,maxCombo=0,answered=false;function show(id){['start','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function init(){data=DATA.filter(x=>x&&x.word&&x.meaning).map((x,i)=>({id:Number(x.id)||i+1,word:String(x.word).trim(),meaning:String(x.meaning).trim(),example:String(x.example||''),example_jp:String(x.example_jp||'')}));if(data.length!==1400)throw Error('内蔵単語データの件数が想定と異なります（'+data.length+'件）');$('from').max=data.length;$('to').max=data.length;$('to').value=data.length;$('info').textContent=data.length+'語を内蔵データから読み込みました。ゲームスタートできます！';$('startBtn').disabled=false;$('startBtn').textContent='🎮 ゲームスタート！'}function makeQuestions(){let from=Math.max(1,Number($('from').value)||1),to=Math.min(data.length,Number($('to').value)||data.length);if(from>to)[from,to]=[to,from];let pool=data.filter(x=>x.id>=from&&x.id<=to);if(pool.length<4)throw Error('出題範囲には4語以上必要です。');let n=Math.min(Number($('count').value)||20,pool.length);let mode=$('mode').value;questions=shuffle(pool).slice(0,n).map(item=>{let m=mode==='mixed'?(Math.random()<.5?'en-ja':'ja-en'):mode;let key=m==='en-ja'?'meaning':'word',correctValue=item[key],cand=shuffle(pool.filter(x=>x.id!==item.id).map(x=>x[key]).filter(Boolean)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);return{item,mode:m,correctValue,choices:shuffle([correctValue,...cand])}})}function start(){try{makeQuestions();current=score=correct=combo=maxCombo=0;answered=false;show('game');render()}catch(e){show('start');$('err').textContent=e.message;$('err').classList.remove('hidden')}}function render(){let q=questions[current];answered=false;$('qnum').textContent='Q '+(current+1)+' / '+questions.length;$('bar').style.width=(current/questions.length*100)+'%';$('score').textContent=score;$('combo').textContent='🔥 COMBO ×'+combo;$('type').textContent=q.mode==='en-ja'?'英語 → 日本語':'日本語 → 英語';$('question').textContent=q.mode==='en-ja'?q.item.word:q.item.meaning;$('feedback').textContent='';$('next').classList.add('hidden');let box=$('choices');box.innerHTML='';q.choices.forEach(v=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=v;b.onclick=()=>answer(b,v);box.appendChild(b)})}function answer(btn,v){if(answered)return;answered=true;let q=questions[current],ok=v===q.correctValue;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(ok){correct++;combo++;maxCombo=Math.max(maxCombo,combo);let pts=100+Math.max(0,combo-1)*20;score+=pts;btn.classList.add('correct');$('feedback').textContent='⭕ 正解！ +'+pts+'点'}else{combo=0;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===q.correctValue)b.classList.add('correct')});$('feedback').textContent='❌ 不正解… 正解は「'+q.correctValue+'」'}$('score').textContent=score;$('combo').textContent='🔥 COMBO ×'+combo;$('next').textContent=current+1<questions.length?'次の問題へ':'結果を見る';$('next').classList.remove('hidden')}function next(){if(!answered)return;if(current+1<questions.length){current++;render()}else finish()}function finish(){show('result');$('finalScore').textContent=score;$('correct').textContent=correct;$('total').textContent=questions.length;$('accuracy').textContent=Math.round(correct/questions.length*100)+'%';$('maxCombo').textContent=maxCombo;let r=correct/questions.length;$('message').textContent=r===1?'パーフェクト！すごい！':r>=.8?'かなりいい感じ！':r>=.6?'あと少し！もう一回挑戦しよう！':'まずはもう一度挑戦してみよう！'}$('startBtn').onclick=start;$('next').onclick=next;$('again').onclick=()=>{show('start');$('err').classList.add('hidden')};try{init()}catch(e){$('info').textContent='初期化に失敗しました';$('err').textContent=e.message;$('err').classList.remove('hidden')}})();
</script></body></html>
